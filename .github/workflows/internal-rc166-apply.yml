name: Internal RC166 apply qualification milestones

on:
  push:
    branches:
      - codex/internal-source-export

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/vr-renderscale-RC166lessons-integrated-v2
          fetch-depth: 0

      - name: Verify immutable base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "84a6378088f1820d51e674c6818f0ad773db0674"
          git fetch origin main-VR
          test "$(git rev-parse origin/main-VR)" = "84a6378088f1820d51e674c6818f0ad773db0674"

      - name: Configure integration identity
        shell: bash
        run: |
          git config user.name "ParticleTroned"
          git config user.email "248299730+ParticleTroned@users.noreply.github.com"

      - name: Restore reviewed patch stream
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/qualification.mbox
          test "$(grep -c '^From [0-9a-f]\{40\} Mon Sep 17 00:00:00 2001$' /tmp/qualification.mbox)" = "4"

      - name: Apply reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          git am --3way /tmp/qualification.mbox
          test "$(git rev-list --count 84a6378088f1820d51e674c6818f0ad773db0674..HEAD)" = "4"

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main-VR...HEAD
          git log --check origin/main-VR..HEAD
          g++ -std=c++23 -Isrc tests/vr_render_scale_qualification_policy_test.cpp -o /tmp/qualification-policy-test
          /tmp/qualification-policy-test
          cmake -DPROJECT_ROOT="$PWD" -P tests/vr_render_scale_devbench_contract_test.cmake
          test -z "$(git status --porcelain)"

      - name: Push cumulative branch
        shell: bash
        run: git push origin HEAD:codex/vr-renderscale-RC166lessons-integrated-v2

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc166-qualification-apply-evidence
          path: |
            /tmp/qualification.mbox
          retention-days: 1
