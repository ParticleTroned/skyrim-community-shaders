name: Internal source export

on:
  push:
    branches:
      - codex/internal-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracked source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Archive tracked source
        shell: bash
        run: git archive --format=zip --output=source-export.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: source-export.zip
          if-no-files-found: error
          retention-days: 1
