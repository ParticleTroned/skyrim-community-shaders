name: Temporary NR colour workbench
on:
  push:
    branches: [work/nr-colour-20260913-f7f2679]
    paths: [.github/workflows/csx-nr-colour-workbench.yml, tools/nr_colour_workbench.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
      - name: Source snapshot for analysis
        run: git archive --format=zip --output=nr-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nr-source-snapshot
          path: nr-source.zip
          retention-days: 1
