name: "Release: Semantic Version"

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release type"
                required: true
                type: choice
                default: "rc"
                options:
                    - rc
                    - stable

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            # TEMPORARY DEBUG: verify the release token can actually reach
            # the repo before checkout. Remove once the auth issue is resolved.
            - name: Verify release token
              env:
                  TOKEN: ${{ secrets.RELEASE_PAT }}
              run: |
                  set -euo pipefail
                  if [ -z "${TOKEN}" ]; then
                    echo "::error::Release token is EMPTY - check RELEASE_PAT."
                    exit 1
                  fi
                  echo "Token length: ${#TOKEN}"
                  echo "--- repo visibility & permissions ---"
                  curl -sS -H "Authorization: Bearer ${TOKEN}" \
                    "https://api.github.com/repos/${{ github.repository }}" \
                    | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("full_name") or d); print("perms:", d.get("permissions"))'

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Apply feature version bumps
              run: |
                  python tools/feature_version_audit.py \
                    --apply-bumps \
                    --output /tmp/feature-version-audit.txt

            - name: Semantic Release
              id: semantic
              uses: cycjimmy/semantic-release-action@v6
              with:
                  extra_plugins: |
                      @google/semantic-release-replace-plugin
                      @semantic-release/git
                      @semantic-release/github
                  tag_format: "v${version}"
              env:
                  # RELEASE_PAT required for two reasons:
                  # 1. Allows pushing the version commit and tag to the protected
                  #    dev branch (GITHUB_TOKEN cannot bypass branch protection).
                  # 2. A PAT-sourced tag push triggers downstream workflows
                  #    (release-build.yaml); GITHUB_TOKEN pushes do not.
                  GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
                  RELEASE_TYPE: ${{ github.event.inputs.release_type }}
