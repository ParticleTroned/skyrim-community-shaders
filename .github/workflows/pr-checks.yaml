name: "PR: Checks"

on:
    # Run untrusted fork code under pull_request so GitHub supplies a read-only
    # token and withholds secrets. Workflow definitions come from the PR merge
    # commit; checked-out actions and configs come from the exact PR head.
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - "**.cpp"
            - "**.h"
            - "**.hpp"
            - "**.c"
            - "**.hlsl"
            - "**.hlsli"
            - "**.ini"
            - "CMakeLists.txt"
            - "CMakePresets.json"
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - ".gitmodules"
            - "extern/**"
            - "cmake/**"
            - "features/**"
            - "src/Features/**"
            - "package/Shaders/**"
            - "tests/shaders/**"
            - ".github/workflows/pr-checks.yaml"
            - ".github/workflows/_shared-build.yaml"
            - ".github/actions/**"
            - ".github/configs/**"

# Least-privilege defaults; individual jobs override where needed.
permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    check-changes:
        name: Check for changes in PRs
        runs-on: ubuntu-latest
        outputs:
            # Under pull_request, the two active workflow definitions and the
            # checked-out actions/configs are PR-controlled. Treat changes to
            # any of them as build-impacting so they exercise every path.
            should-build: ${{ steps.changed-files.outputs.build_any_changed == 'true' || steps.changed-files.outputs.cpp_any_changed == 'true' || steps.changed-files.outputs.build_ci_any_changed == 'true' || steps.changed-files.outcome == 'failure' }}
            hlsl-should-build: ${{ steps.changed-files.outputs.hlsl_any_changed == 'true' || steps.changed-files.outputs.cmake_any_changed == 'true' || steps.changed-files.outputs.build_ci_any_changed == 'true' || steps.ini-version-check.outputs.version_changed == 'true' || steps.changed-files.outcome == 'failure' }}
            shader-tests-should-build: ${{ steps.changed-files.outputs.shader_tests_any_changed == 'true' || steps.changed-files.outputs.hlsl_any_changed == 'true' || steps.changed-files.outputs.cmake_any_changed == 'true' || steps.changed-files.outputs.build_ci_any_changed == 'true' || steps.ini-version-check.outputs.version_changed == 'true' || steps.changed-files.outcome == 'failure' }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Fetch PR head and base
              run: |
                  git fetch origin refs/pull/${{ github.event.pull_request.number }}/head
                  git fetch origin ${{ github.event.pull_request.base.sha }}

            - name: Get changed files
              id: changed-files
              uses: tj-actions/changed-files@v46
              continue-on-error: true
              with:
                  files_yaml: |
                      cpp:
                        - '**.cpp'
                        - '**.h'
                        - '**.hpp'
                        - '**.c'
                        - 'src/**'
                        - 'include/**'
                        - '!**.hlsl'
                        - '!**.hlsli'
                        - '!tests/shaders/**'
                      build:
                        - 'CMakeLists.txt'
                        - 'CMakePresets.json'
                        - 'vcpkg.json'
                        - 'vcpkg-configuration.json'
                        - '.gitmodules'
                        - 'extern/**'
                      cmake:
                        - 'CMakeLists.txt'
                        - 'CMakePresets.json'
                        - 'cmake/**'
                      # These workflow definitions are resolved from the PR merge
                      # commit; actions/configs are read from the exact PR head.
                      build_ci:
                        - '.github/workflows/pr-checks.yaml'
                        - '.github/workflows/_shared-build.yaml'
                        - '.github/actions/**'
                        - '.github/configs/**'
                      hlsl:
                        - '**.hlsl'
                        - '**.hlsli'
                        - 'package/Shaders/**'
                        - 'features/**/Shaders/**'
                        - '!features/**/Shaders/Features/*.ini'
                      # Most INI fields are package metadata; only a Version
                      # change needs shader validation and shader tests.
                      feature_ini:
                        - 'features/**/Shaders/Features/*.ini'
                      shader_tests:
                        - 'tests/shaders/**'
                  base_sha: ${{ github.event.pull_request.base.sha }}
                  sha: ${{ github.event.pull_request.head.sha }}

            # feature_ini_any_changed is too broad on its own; only treat it
            # like an HLSL change if the diff actually touches a Version line.
            - name: Check feature INI Version changes
              id: ini-version-check
              if: steps.changed-files.outputs.feature_ini_any_changed == 'true'
              run: |
                  set -euo pipefail
                  version_changed=false
                  while IFS= read -r file; do
                    if git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$file" | grep -qE '^[+-][[:space:]]*Version[[:space:]]*='; then
                      version_changed=true
                      break
                    fi
                  done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'features/*/Shaders/Features/*.ini')
                  echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"

    # Security: this job compiles untrusted fork code under pull_request, whose
    # fork runs receive a read-only token and no secrets. The shared workflow
    # also declares contents: read; the absence of a secrets block is intentional.
    build:
        name: Build (PR)
        needs: [check-changes]
        if: >
            always() && !cancelled() &&
            !github.event.pull_request.draft
        uses: ./.github/workflows/_shared-build.yaml
        with:
            ref: ${{ github.event.pull_request.head.sha }}
            repository: ${{ github.event.pull_request.head.repo.full_name }}
            run-cpp: ${{ needs.check-changes.outputs.should-build != 'false' }}
            run-shader-validation: ${{ needs.check-changes.outputs.hlsl-should-build != 'false' }}
            run-shader-tests: ${{ needs.check-changes.outputs.shader-tests-should-build != 'false' }}
            hlsl-should-build: ${{ needs.check-changes.outputs.hlsl-should-build || 'true' }}
            shader-tests-should-build: ${{ needs.check-changes.outputs.shader-tests-should-build || 'true' }}

    # Security: release publication is write-capable, so only branches in this
    # repository may run it. Fork PRs still receive ordinary build artifacts.
    prerelease:
        name: Post Prerelease from PR
        needs: [build]
        if: >
            always() && !cancelled() &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            needs.build.outputs.cpp-built == 'true'
        runs-on: windows-2025
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Download dist artifacts
              uses: actions/download-artifact@v7
              with:
                  name: dist-artifacts
                  path: dist/

            - name: Generate release notes comparing against base version tag
              id: gen_notes
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  TAG="v${{ needs.build.outputs.version }}-pr${{ github.event.pull_request.number }}"
                  REPO="${{ github.repository }}"
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  HEAD_SHA="${{ github.event.pull_request.head.sha }}"
                  PR_NUMBER="${{ github.event.pull_request.number }}"
                  PR_URL="https://github.com/$REPO/pull/$PR_NUMBER"

                  if PR_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author -q '.author.login' 2>/dev/null); then
                    echo "✅ Found PR author: $PR_AUTHOR"
                  else
                    PR_AUTHOR="${{ github.event.pull_request.user.login }}"
                    echo "⚠️ Using fallback PR author: $PR_AUTHOR"
                  fi

                  echo "🔍 Comparing $BASE_SHA...$HEAD_SHA"

                  if NOTES=$(gh api repos/$REPO/compare/$BASE_SHA...$HEAD_SHA 2>/dev/null | jq -r --arg author "$PR_AUTHOR" '
                    .commits[]
                    | "- \(.commit.message | split("\n")[0]) by @\(.author.login // $author)"
                  ' 2>/dev/null) && [[ -n "$NOTES" ]]; then
                    echo "$NOTES" > release-notes.md
                    echo -e "\n[View Pull Request]($PR_URL)" >> release-notes.md
                    echo "notes_generated=true" >> "$GITHUB_OUTPUT"
                    echo "✅ Generated custom release notes"
                  else
                    echo "⚠️ Failed to generate notes from commit diff. Will use GitHub autogeneration." >&2
                    echo "notes_generated=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Upload prerelease (custom notes)
              if: steps.gen_notes.outputs.notes_generated == 'true'
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
              with:
                  name: "CSX ${{ needs.build.outputs.version }} PR #${{ github.event.pull_request.number }}"
                  tag: v${{ needs.build.outputs.version }}-pr${{ github.event.pull_request.number }}
                  # Anchor the preview tag to the PR head, not the merge commit,
                  # so the tag stays outside dev's history. A PR that
                  # bumped CMake VERSION (e.g. a breaking change to 2.0.0) would
                  # then expose a higher reachable version tag and poison
                  # semantic-release's floor for every RC cut from dev.
                  commit: ${{ github.event.pull_request.head.sha }}
                  prerelease: true
                  artifacts: "${{ github.workspace }}/dist/CSX_AIO-*.7z"
                  bodyFile: release-notes.md
                  allowUpdates: true
                  replacesArtifacts: true
                  removeArtifacts: true

            - name: Upload prerelease (auto-generated notes)
              if: steps.gen_notes.outputs.notes_generated != 'true'
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
              with:
                  name: "CSX ${{ needs.build.outputs.version }} PR #${{ github.event.pull_request.number }}"
                  tag: v${{ needs.build.outputs.version }}-pr${{ github.event.pull_request.number }}
                  # Anchor to the PR head, not the base tip — see the custom-notes
                  # step above for why dev-reachable preview tags break releases.
                  commit: ${{ github.event.pull_request.head.sha }}
                  prerelease: true
                  artifacts: "${{ github.workspace }}/dist/CSX_AIO-*.7z"
                  generateReleaseNotes: true
                  allowUpdates: true
                  replacesArtifacts: true
                  removeArtifacts: true

            - name: Comment on PR
              if: success()
              uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
              with:
                  mode: upsert
                  comment-tag: prerelease-build
                  message: |
                      ✅ A pre-release build is available for this PR:
                      [Download](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}-pr${{ github.event.pull_request.number }})

    feature-audit-pr:
        name: Feature Version Audit (PR)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  submodules: recursive
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Fetch PR head and base
              run: |
                  git fetch origin refs/pull/${{ github.event.pull_request.number }}/head:refs/pr_head
                  git fetch origin ${{ github.event.pull_request.base.sha }}

            - name: Run feature version audit (PR check)
              id: audit
              run: |
                  set +e
                  python tools/feature_version_audit.py --pr-check --ci --base ${{ github.event.pull_request.base.sha }} --head refs/pr_head > pr-feature-audit.md
                  EXIT_CODE=$?
                  set -e
                  cat pr-feature-audit.md
                  exit $EXIT_CODE

            - name: Upload feature audit markdown (PR)
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: pr-feature-audit
                  path: pr-feature-audit.md

    feature-audit-pr-comment:
        name: Comment on PR with audit results
        if: >
            always() &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            (needs.feature-audit-pr.result == 'success' || needs.feature-audit-pr.result == 'failure')
        needs: feature-audit-pr
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - name: Download feature audit markdown (PR)
              continue-on-error: true
              uses: actions/download-artifact@v7
              with:
                  name: pr-feature-audit
                  path: .

            - name: Create fallback audit markdown
              if: ${{ hashFiles('pr-feature-audit.md') == '' }}
              shell: bash
              run: |
                  cat > pr-feature-audit.md <<'EOF'
                  ⚠️ Feature version audit did not produce a report. Check the `Feature Version Audit (PR)` job logs.
                  EOF

            - name: Comment on PR with audit results
              uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
              with:
                  file-path: pr-feature-audit.md
                  mode: upsert
                  comment-tag: feature-version-audit
