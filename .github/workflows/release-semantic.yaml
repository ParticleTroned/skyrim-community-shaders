name: "Release: Semantic Version"

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release type"
                required: true
                type: choice
                default: "rc"
                options:
                    - rc
                    - stable
            skip_feature_bumps:
                description: "Skip automatic feature .ini version bumps and hand-manage feature versions for this release."
                type: boolean
                required: false
                default: false
            expected_version:
                description: "Required next patch version for main-VR, e.g. 3.19.2."
                type: string
                required: false
                default: ""

permissions:
    contents: write
    # actions:write lets this job dispatch release-build.yaml after cutting a
    # release (the tag push can't trigger it — see the step below).
    actions: write

jobs:
    release:
        if: github.ref != 'refs/heads/main-VR'
        runs-on: ubuntu-latest
        steps:
            # TEMPORARY DEBUG: verify the release token can actually reach
            # the repo before checkout. Remove once the auth issue is resolved.
            - name: Verify release token
              env:
                  TOKEN: ${{ secrets.RELEASE_PAT }}
              run: |
                  set -euo pipefail
                  if [ -z "${TOKEN}" ]; then
                    echo "::error::Release token is EMPTY - check RELEASE_PAT."
                    exit 1
                  fi
                  echo "Token length: ${#TOKEN}"
                  echo "--- repo visibility & permissions ---"
                  curl -sS -H "Authorization: Bearer ${TOKEN}" \
                    "https://api.github.com/repos/${{ github.repository }}" \
                    | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("full_name") or d); print("perms:", d.get("permissions"))'

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Apply feature version bumps
              if: ${{ !inputs.skip_feature_bumps }}
              run: |
                  python tools/feature_version_audit.py \
                    --apply-bumps \
                    --output /tmp/feature-version-audit.txt

            # Catch incomplete automatic bumps and gaps in hand-managed bumps.
            - name: Verify feature versions
              run: |
                  set +e
                  python tools/feature_version_audit.py --ci --output feature-audit-verify.md
                  EXIT_CODE=$?
                  set -e
                  cat feature-audit-verify.md
                  exit $EXIT_CODE

            - name: Semantic Release
              id: semantic
              uses: cycjimmy/semantic-release-action@v6
              with:
                  extra_plugins: |
                      @google/semantic-release-replace-plugin
                      @semantic-release/git
                      @semantic-release/github
                  tag_format: "v${version}"
              env:
                  # RELEASE_PAT required for two reasons:
                  # 1. Allows pushing the version commit and tag to the protected
                  #    dev branch (GITHUB_TOKEN cannot bypass branch protection).
                  # 2. A PAT-sourced tag push triggers downstream workflows
                  #    (release-build.yaml); GITHUB_TOKEN pushes do not.
                  GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
                  RELEASE_TYPE: ${{ github.event.inputs.release_type }}

            - name: Build artifacts for the new release
              # The release tag does NOT auto-trigger release-build.yaml: it sits
              # on a `chore(release): ... [skip ci]` commit (the tag push is skipped)
              # and the GitHub release is created as a draft (no `release: created`
              # event fires). So dispatch the build explicitly here to populate the
              # draft with .7z artifacts. Publishing the draft later does NOT
              # rebuild - release-build.yaml skips its build job on the
              # `release: published` event - it just publishes the already-attached
              # artifacts and fires the Nexus dry-run via `release: published`.
              if: steps.semantic.outputs.new_release_published == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
              run: |
                  gh workflow run release-build.yaml \
                    --repo "${{ github.repository }}" \
                    --ref "${TAG}"

    csx-release:
        if: github.ref == 'refs/heads/main-VR'
        runs-on: ubuntu-latest
        concurrency:
            group: csx-stable-release
            cancel-in-progress: false
        steps:
            - name: Checkout exact main-VR dispatch
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: true
                  token: ${{ github.token }}

            - name: Validate release plan
              id: plan
              env:
                  EXPECTED_VERSION: ${{ inputs.expected_version }}
                  RELEASE_TYPE: ${{ inputs.release_type }}
                  DISPATCH_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  test "$RELEASE_TYPE" = stable
                  test "$(git ls-remote origin refs/heads/main-VR | cut -f1)" = "$DISPATCH_SHA"
                  python tests/csx_release_test.py
                  python tools/csx_release.py plan --expected-version "$EXPECTED_VERSION" \
                    --github-output "$GITHUB_OUTPUT" --notes "$RUNNER_TEMP/csx-release-notes.md"

            - name: Apply and verify feature versions
              env:
                  BASE_TAG: ${{ steps.plan.outputs.base }}
                  SKIP_BUMPS: ${{ inputs.skip_feature_bumps }}
              run: |
                  set -euo pipefail
                  if [ "$SKIP_BUMPS" != true ]; then
                    python tools/feature_version_audit.py --base "$BASE_TAG" \
                      --apply-bumps --output "$RUNNER_TEMP/feature-version-audit.md"
                  fi
                  python tools/feature_version_audit.py --base "$BASE_TAG" \
                    --ci --output "$RUNNER_TEMP/feature-version-audit.md"

            - name: Commit audited feature metadata
              env:
                  RELEASE_VERSION: ${{ steps.plan.outputs.version }}
                  DISPATCH_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  test "$(git ls-remote origin refs/heads/main-VR | cut -f1)" = "$DISPATCH_SHA"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- 'features/*/Shaders/Features/*.ini'
                  if ! git diff --cached --quiet; then
                    git commit -m "build(release): prepare CSX $RELEASE_VERSION metadata" \
                      -m $'Rationale:\nInvalidate affected shader features for the stable release.' \
                      -m $'Implementation:\nApply audited feature versions before building the exact release ref.'
                    git push origin HEAD:refs/heads/main-VR
                  fi
                  test -z "$(git status --porcelain)"

            - name: Create draft and dispatch production build
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.plan.outputs.tag }}
                  RELEASE_VERSION: ${{ steps.plan.outputs.version }}
              run: |
                  set -euo pipefail
                  release_sha=$(git rev-parse HEAD)
                  test "$(git ls-remote origin refs/heads/main-VR | cut -f1)" = "$release_sha"
                  git tag -a "$RELEASE_TAG" "$release_sha" -m "CSX $RELEASE_VERSION"
                  git push origin "refs/tags/$RELEASE_TAG"
                  gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
                    --verify-tag --draft --title "CSX $RELEASE_VERSION" \
                    --notes-file "$RUNNER_TEMP/csx-release-notes.md"
                  gh workflow run release-build.yaml --repo "${{ github.repository }}" \
                    --ref "$RELEASE_TAG" -f build-cpp=true -f validate-shaders=true -f include-se-ae=true
