name: "Release: Prebuilt Shader Cache"

on:
    workflow_call:
        inputs:
            target_ref:
                description: "Git ref, tag, or commit to build caches from"
                type: string
                required: false
                default: ""
            runtime:
                description: "Runtime(s) to build"
                type: string
                required: false
                default: "both"
            plugin_version_se:
                description: "Optional SE plugin version override for Info.ini"
                type: string
                required: false
                default: ""
            plugin_version_vr:
                description: "Optional VR plugin version override for Info.ini"
                type: string
                required: false
                default: ""
    workflow_dispatch:
        inputs:
            target_ref:
                description: "Git ref, tag, or commit to build caches from (blank = current workflow commit)"
                required: false
                default: ""
            runtime:
                description: "Runtime(s) to build"
                type: choice
                required: true
                default: "both"
                options:
                    - "both"
                    - "SE"
                    - "VR"
            plugin_version_se:
                description: "Optional SE plugin version override for Info.ini"
                required: false
                default: ""
            plugin_version_vr:
                description: "Optional VR plugin version override for Info.ini"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    build:
        name: Build shader cache (${{ matrix.runtime }})
        runs-on: windows-2025
        strategy:
            matrix:
                runtime: ${{ fromJSON(inputs.runtime == 'both' && '["SE","VR"]' || inputs.runtime == 'SE' && '["SE"]' || inputs.runtime == 'VR' && '["VR"]' || '["INVALID"]') }}
            fail-fast: false
        steps:
            - name: Resolve target ref
              id: resolve
              shell: bash
              env:
                  INPUT_TARGET_REF: ${{ inputs.target_ref }}
              run: |
                  set -euo pipefail

                  case "$INPUT_TARGET_REF" in
                    *$'\r'*|*$'\n'*)
                      echo "::error::target_ref must be a single-line Git ref, tag, or commit"
                      exit 1
                      ;;
                  esac

                  if [ -n "$INPUT_TARGET_REF" ]; then
                    target_ref="$INPUT_TARGET_REF"
                    label="$INPUT_TARGET_REF"
                  else
                    target_ref="${GITHUB_SHA}"
                    label="${GITHUB_REF_NAME:-${GITHUB_SHA:0:7}}"
                  fi

                  case "$label" in
                    refs/tags/*|refs/heads/*) label="${label##*/}" ;;
                  esac

                  safe_label="$(
                    printf '%s' "$label" |
                      LC_ALL=C sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//'
                  )"
                  if [ -z "$safe_label" ]; then
                    safe_label="${GITHUB_SHA:0:7}"
                  fi

                  echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
                  echo "artifact_label=$safe_label" >> "$GITHUB_OUTPUT"

            - name: Checkout target source
              uses: actions/checkout@v6
              with:
                  ref: ${{ steps.resolve.outputs.target_ref }}

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install shader cache tools
              shell: bash
              run: python -m pip install -r tools/shader-cache-requirements.txt

            - name: Test shader cache packaging contract
              shell: bash
              run: |
                  if [ -f tests/shader_cache_packaging_test.py ]; then
                    python tests/shader_cache_packaging_test.py
                  else
                    echo "Target ref predates shader-cache packaging tests; skipping."
                  fi

            - name: Build, validate, and package shader cache
              shell: pwsh
              env:
                  PLUGIN_VERSION_SE: ${{ inputs.plugin_version_se }}
                  PLUGIN_VERSION_VR: ${{ inputs.plugin_version_vr }}
              run: |
                  $pluginVersion = ''
                  if ('${{ matrix.runtime }}' -eq 'SE') {
                    $pluginVersion = $env:PLUGIN_VERSION_SE
                  } else {
                    $pluginVersion = $env:PLUGIN_VERSION_VR
                  }

                  $args = @(
                    'tools/build-shader-cache.py',
                    '--runtime', '${{ matrix.runtime }}',
                    '--out', 'dist/shader-cache',
                    '--jobs', '4',
                    '--package',
                    '--package-label', '${{ steps.resolve.outputs.artifact_label }}'
                  )

                  if ($pluginVersion -ne '') {
                    $args += @('--plugin-version', $pluginVersion)
                  }

                  & python @args
                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }

            - name: Upload shader cache artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ShaderCache-${{ matrix.runtime }}
                  path: dist/shader-cache/ShaderCache-${{ matrix.runtime }}-${{ steps.resolve.outputs.artifact_label }}.7z
                  if-no-files-found: error
                  retention-days: 30
