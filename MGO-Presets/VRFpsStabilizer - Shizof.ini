################################################################################################
# This is the config file for VR Fps Stabilizer mod - 90hz medium quality
#
#
# # ->This is the comment character.
#
# Level lines that start with ENB> are for enb setting changes. Usage: ENB>filename:category:parameter=value   Example: ENB>enbseries.ini:EFFECT:EnableSunRays=true
# Level lines that start with CONSOLE> are for running console command when switching to that level. Usage: CONSOLE>command
# Level lines that start with TOGGLE> are for running console commands that toggles when switching to that level and toggles again when it's at lower levels. Only use once. For example use it in only level 5. Usage: TOGGLE>command   Example: TOGGLE>tg    Note: Don't use "TOGGLE>tg" at the same time with GrassChange=1
# Level lines that start with CS> are for CS setting changes. Usage: CS>Setting=value   Example: CS>SSGI = 0
#
################################################################################################
[Settings]
EnableLog=0         #This prints the current config change action in the log file. May be used for testing if the config setting. Config file is located at: "My Documents\My Games\Skyrim VR\SKSE\VRFpsStabilizerPlugin.log"

AutoConfigEnabled=1          #Set this to 0 if you only want to use console feature of this mod.

CheckSleepDuration=12        #Sleep duration between frametime checks. Integer value.  Make sure this is at least higher than 11.

MinTargetFrameTime=8.5       #This is the min target frametime we are trying to achieve. Decimal value. A little headroom is always good. I suggest setting it below 11. And below max.
MaxTargetFrameTime=9.5       #This is the max target frametime we are trying to achieve. Decimal value. A little headroom is always good. I suggest setting it below 11. And above min.

FrameTimeChangeThreshold=0.5 #This is the frametime change required for checking if a different level setting is more suitable. Decimal value.

LevelChangeBackUpWait = 80     #This is the duration in terms of check cycles to wait before changing the level back up. 80 corresponds to 5 seconds approximately(Each cycle is 5 checks, (CheckSleepDuration*5*LevelChangeBackWait)/1000)
LevelChangeBackDownWait = 80     #This is the duration in terms of check cycles to wait before changing the level back down. 80 corresponds to 5 seconds approximately(Each cycle is 5 checks, (CheckSleepDuration*5*LevelChangeBackWait)/1000)
LevelChangeBackUpAngle = 30    #This is the player heading angle change required in degrees to change the level back up.



#########LOD Fade#############
AdjustActorLODFade = 1          #This enables adjusting actor lod fade value automatically according to cpu late starts
MinfLODFadeOutMultActors = 7    #Minimum value to set fLODFadeOutMultActors
MaxfLODFadeOutMultActors = 10    #Maximum value to set fLODFadeOutMultActors

AdjustObjectLODFade = 1          #This enables adjusting object lod fade value automatically according to cpu late starts
MinfLODFadeOutMultObjects = 10    #Minimum value to set fLODFadeOutMultObjects
MaxfLODFadeOutMultObjects = 14   #Maximum value to set fLODFadeOutMultObjects

AdjustItemLODFade = 1          #This enables adjusting item lod fade value automatically according to cpu late starts
MinfLODFadeOutMultItems = 4    #Minimum value to set fLODFadeOutMultItems
MaxfLODFadeOutMultItems = 8   #Maximum value to set fLODFadeOutMultItems

RiftenLODFadeOutModifierActors = -5    #MinfLODFadeOutMultActors modifier for Riften city
RiftenLODFadeOutModifierObjects = -6    #MinfLODFadeOutMultObjects modifier for Riften city
RiftenLODFadeOutModifierItems = -2    #MinfLODFadeOutMultItems modifier for Riften city
OtherCitiesLODFadeOutModifierActors = -3    #MinfLODFadeOutMultActors modifier for other cities
OtherCitiesLODFadeOutModifierObjects = -2    #MinfLODFadeOutMultObjects modifier for other cities
OtherCitiesLODFadeOutModifierItems = -1    #MinfLODFadeOutMultItems modifier for other cities

CPULateStartAngleToSwitchBackUp = 30      #This is the player heading angle change required in degrees to change the value back up.
CPULateStartDistanceToSwitchBackUp = 300  #This is the player movement distance required to change the value back up.

CPULateStartChangeThreshold = 2.0   #This is the cpu late start amount required for checking if a different setting is more suitable. Decimal value. Used in both increasing and decreasing values.
CPULateStartCheckFrameCount = 30     #This is the frame count to check for late starts. Max:100.
CPULateStartMinFrameCountToReduce = 4   #This is the minimum frame count required to have cpu late starts to reduce lod fade out value.
CPULateStartMaxFrameCountToIncrease = 0 #This is the frame count required to have cpu late starts to increase lod fade out value.
LODFadeOutValueUpWait = 30     #This is the duration in terms of check cycles to wait before changing the value back up.
LODFadeOutValueDownWait = 10   #This is the duration in terms of check cycles to wait before changing the value back down.
##############################

#Grass Change
GrassChange = 1             #Set this to 1 if you want to turn grass off in Cities, interiors, basically all areas not in Tamriel worldspace etc.
WithGrassWorlds=RiftvaleLodge.esp|140C8E  #Write ESPNAME|FormId list here separated with commas if you want grass in those worlds. Usage: Espname.esp|000000,Espname2.esp|000000
NoGrassWorlds=              #Write ESPNAME|FormId list here separated with commas if you don't want grass in those worlds. Usage: Espname.esp|000000,Espname2.esp|000000


#LOD Change
LODcitychange = 0           #Set this to 1 if you want to turn LODs off in cities.
LODinteriorchange=0         #Set this to 1 if you want to turn LODs off in interiors.


RainLODOffset = 10000  #Reduces LOD settings by this value during rain


# CSX owns render-change coverage and releases Skyrim's native loading fade as
# soon as the completed stereo state is ready. A separate timed Stabby fade
# would stack with that transition and cause redundant fade-ins.
CSVRFadeToBlackDuration = 0


################Dynamic Resolution (Experimental)##########################
AdjustDynamicResolution = 0   #Enables automatic dynamic resolution adjustment in levels. Set bEnableAutoDynamicResolution = 1 in your game ini first.
MinDynamicResolutionRatio = 0.9
MaxDynamicResolutionRatio = 1.0
DynamicResolutionStartLevel = 7  #Adjusts dynamic resolution starting this level. This level will be MaxDynamicResolutionRatio, any level before that will be 1.0 and and levels after that will have lower ratio.

###################################################################
