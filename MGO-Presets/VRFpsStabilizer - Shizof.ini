#taa hf 0.100000
#taa ps 1.000000
#taa po 0.675000

[PostLoadGame]  #Runs after a saved game is loaded



[AfterLoadGame]  #Runs after a saved game is loaded and Player is in a cell




[NewGame]  #Runs when a new game event is detected
#player.addspell 0002dd2a



[Conditional]  #Runs when a specific exterior/interior and time period condition is met.
#Usage is like this: Space,Raining,Snowing,NotRaining,NotSnowing|HourStart|HourEnd|command or Space,Raining,Snowing,NotRaining,NotSnowing|command  Example: Interior|4|16|taa hf 0.0001 or Exterior|2.5|9.5|taa hf 0.10 or #Interior|taa hf 0.10

#Exterior|IMOD>Imaginator BETA.esp-009A49 = 0 #Brightness
#Interior|IMOD>Imaginator BETA.esp-009A49 = 1 #Brightness

#Exterior|IMOD>Imaginator BETA.esp-009A4F = 0 #Saturation
#Interior|IMOD>Imaginator BETA.esp-009A4F = 1 #Saturation

#Exterior|IMOD>Imaginator BETA.esp-009A34 = 0 #Contrast
#Interior|IMOD>Imaginator BETA.esp-009A34 = 1 #Contrast


#Exterior|INI>fMinOccludeeBoxExtent:VR = 600
#Interior|INI>fMinOccludeeBoxExtent:VR = 0.5

#Exterior|INI>bDepthBufferCulling:VRPerformance = 1
#Interior|INI>bDepthBufferCulling:VRPerformance = 0


#Example CS API usage. Toggle SSS and SSGI in exteriors during rain:
Interior|CS>SSS = 1
Interior|CS>SSGI = 1

Exterior,Raining|CS>SSS = 0
Exterior,Raining|CS>SSGI = 0

Exterior,NotRaining|CS>SSS = 1
Exterior,NotRaining|CS>SSGI = 1

#Interior|CS>DLSSProfile = 1   #Use DLSS Profile K in interiors
#Interior|CS>DLSSMode = 0   #Use DLAA in interiors

#Exterior|CS>DLSSProfile = 3   #Use DLSS Profile M in exteriors
#Exterior|CS>DLSSMode = 5   #Use DLSS Mode 0.85 in exteriors


Interior|CS>UpscaleMethod = 3 #DLSS
Interior|CS>DLSSProfile = 1 #Use DLSS Profile K in interiors
Interior|CS>UpscalePreset = 0 #Use DLAA in interiors
Interior|CS>RenderScaleMode = 0 #Disable RenderScaleMode in interiors

Exterior|CS>UpscaleMethod = 3 #DLSS
Exterior|CS>DLSSProfile = 1 #Use DLSS Profile K in exteriors
Exterior|CS>UpscalePreset = 5 #Use DLSS Mode 0.85 in exteriors
Exterior|CS>RenderScaleMode = 1 #Enable RenderScaleMode in exteriors




###################################################################
