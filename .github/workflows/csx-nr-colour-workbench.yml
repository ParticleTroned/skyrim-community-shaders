name: Temporary NR colour workbench
on:
  push:
    branches: [work/nr-colour-20260913-f7f2679]
    paths: [.github/workflows/csx-nr-colour-workbench.yml, tools/nr_colour_workbench.py, tools/nr_colour_include_fix.py, 'tools/nr_colour_patch.*.b64']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python tools/nr_colour_workbench.py apply
      - run: python tools/nr_colour_include_fix.py
      - run: python tools/nr_colour_workbench.py linux
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64
      - run: python tools/nr_colour_workbench.py apply
      - run: python tools/nr_colour_include_fix.py
      - run: python tools/nr_colour_workbench.py windows
  candidate:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python tools/nr_colour_workbench.py apply
      - run: python tools/nr_colour_include_fix.py
      - name: Export validated source tree without temporary helpers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/nr_colour_workbench.py publish
      - uses: actions/upload-artifact@v4
        with:
          name: nr-colour-candidate-tree
          path: candidate-tree.json
          retention-days: 1
