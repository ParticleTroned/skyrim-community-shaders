name: "Release: Build Artifacts"

on:
    push:
        tags:
            - "v*"
    release:
        # 'published' covers semantic-release's draft → human publish path
        # (drafts do not fire the 'created' event in practice). 'created'
        # remains for non-draft releases authored directly via the UI/API.
        types: [created, published]
    workflow_dispatch:
        inputs:
            cache-key-suffix:
                description: "Optional suffix to invalidate the build cache"
                required: false
            build-cpp:
                description: "Build C++ plugin and addons for manual dispatch"
                type: boolean
                required: false
                default: true
            validate-shaders:
                description: "Run HLSL shader validation for manual dispatch"
                type: boolean
                required: false
                default: true

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        # Build on dispatch / tag push / a non-draft `release: created`, but NOT
        # on `release: published`: the artifacts were already built and attached
        # when the draft was created, so publishing must not rebuild.
        if: github.event.action != 'published'
        uses: ./.github/workflows/_shared-build.yaml
        with:
            ref: ${{ github.ref }}
            repository: ${{ github.repository }}
            run-cpp: ${{ github.event_name != 'workflow_dispatch' || inputs.build-cpp == true }}
            run-shader-validation: ${{ github.event_name != 'workflow_dispatch' || inputs.validate-shaders == true }}
            run-shader-tests: ${{ github.event_name != 'workflow_dispatch' || inputs.validate-shaders == true }}
            cache-key-suffix: ${{ inputs.cache-key-suffix || '' }}

    prune-stale-cache:
        name: Prune superseded build-cache generations
        needs: build
        if: needs.build.outputs.cpp-built == 'true'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Delete superseded CMake build caches
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  declare -A newest_id newest_time
                  mapfile -t caches < <(
                    gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
                      --paginate \
                      --jq '.actions_caches[] | select(.key | test("^Windows-cmake-msvc-")) | "\(.id)\t\(.created_at)\t\(.key)"'
                  )
                  for cache in "${caches[@]}"; do
                      IFS=$'\t' read -r id created key <<< "$cache"
                      [ -z "$id" ] && continue
                      prefix=$(printf '%s\n' "$key" | sed -E 's/-[0-9a-f]{64}$//')
                      if [ -z "${newest_time[$prefix]:-}" ] || [[ "$created" > "${newest_time[$prefix]}" ]]; then
                          stale_id="${newest_id[$prefix]:-}"
                          newest_time[$prefix]="$created"
                          newest_id[$prefix]="$id"
                      else
                          stale_id="$id"
                      fi
                      if [ -n "$stale_id" ]; then
                          echo "Deleting superseded cache $stale_id ($prefix)"
                          if ! gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$stale_id"; then
                              echo "::warning::Could not delete superseded cache $stale_id"
                          fi
                      fi
                  done

    feature-audit:
        name: Feature Version Audit (Release)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release') && github.event.action != 'published'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Run feature version audit
              run: |
                  python tools/feature_version_audit.py --output feature-version-audit-latest.md
                  cat feature-version-audit-latest.md

            - name: Upload feature audit markdown
              uses: actions/upload-artifact@v7
              with:
                  name: feature-version-audit
                  path: feature-version-audit-latest.md

    shader-cache:
        name: Build Prebuilt Shader Caches
        if: github.event.action != 'published'
        uses: ./.github/workflows/shader-cache.yaml
        with:
            target_ref: ${{ github.ref }}
            runtime: both

    release:
        name: Post Release for Draft, Manual Run, or Tag
        needs: [build, feature-audit, shader-cache]
        if: >
            always() && !cancelled() &&
            needs.build.outputs.cpp-built == 'true' &&
            needs.shader-cache.result == 'success' &&
            github.event.action != 'published' &&
            (github.event_name == 'workflow_dispatch' ||
             startsWith(github.ref, 'refs/tags/v') ||
             (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        runs-on: windows-2025
        outputs:
            release_tag: ${{ steps.combined_notes.outputs.release_tag }}
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - name: Ensure ref is a tag
              if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
              shell: bash
              run: |
                  if [ "${{ github.ref_type }}" != "tag" ]; then
                    echo "This workflow must be run on a tag, not a branch."
                    exit 1
                  fi

            - name: Checkout release packaging tools
              uses: actions/checkout@v6
              with:
                  sparse-checkout: tools

            - name: Setup Python for FOMOD packaging
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Download dist artifacts
              uses: actions/download-artifact@v7
              with:
                  name: dist-artifacts
                  path: dist/

            - name: Download SE shader cache
              uses: actions/download-artifact@v7
              with:
                  name: ShaderCache-SE
                  path: dist/

            - name: Download VR shader cache
              uses: actions/download-artifact@v7
              with:
                  name: ShaderCache-VR
                  path: dist/

            - name: Download feature audit artifact
              continue-on-error: true
              uses: actions/download-artifact@v7
              with:
                  name: feature-version-audit
                  path: .

            - name: Generate combined release notes
              id: combined_notes
              shell: bash
              # GH_TOKEN is required for `gh release view` — without it the
              # call silently failed and the `||` fallback wrote an empty
              # file, which then clobbered the existing release body when
              # ncipollo updated it (this happened on v1.5.1).
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "release" ]; then
                    RELEASE_TAG="${{ github.event.release.tag_name }}"
                  else
                    RELEASE_TAG="${{ github.ref_name }}"
                  fi

                  # Fetch existing body. If the release does not exist yet
                  # (e.g. tag-push trigger before any release was created),
                  # treat empty as acceptable. Any other failure is fatal so
                  # we never clobber a real body with empty content.
                  if gh release view "$RELEASE_TAG" --json body -q .body > auto-release-notes.md 2>/tmp/gh-err; then
                    :
                  else
                    if grep -q 'release not found' /tmp/gh-err; then
                      echo "Release $RELEASE_TAG does not exist yet; starting with empty body."
                      : > auto-release-notes.md
                    else
                      echo "::error::Failed to fetch release body for $RELEASE_TAG:"
                      cat /tmp/gh-err
                      exit 1
                    fi
                  fi

                  if [ -f feature-version-audit-latest.md ]; then
                    # Strip any prior audit section so re-runs don't duplicate
                    # it. Find the first "# Feature Version Audit" heading and
                    # drop everything from the preceding "---" separator
                    # onward.
                    audit_line=$(grep -nx '# Feature Version Audit' auto-release-notes.md | head -1 | cut -d: -f1 || true)
                    if [ -n "${audit_line:-}" ]; then
                      sep_line=$(awk -v target="$audit_line" 'NR < target && /^---$/ { last = NR } END { print last }' auto-release-notes.md)
                      if [ -n "${sep_line:-}" ]; then
                        head -n $((sep_line - 1)) auto-release-notes.md > auto-release-notes.tmp
                        mv auto-release-notes.tmp auto-release-notes.md
                      fi
                    fi
                    echo -e "\n---\n\n" >> auto-release-notes.md
                    cat feature-version-audit-latest.md >> auto-release-notes.md
                  fi
                  echo "body_file=auto-release-notes.md" >> $GITHUB_OUTPUT
                  echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

            - name: Build managed-cache FOMOD AIO
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ steps.combined_notes.outputs.release_tag }}
              run: |
                  $ErrorActionPreference = 'Stop'

                  function Get-SingleArchive {
                      param(
                          [Parameter(Mandatory)] [string] $Pattern,
                          [Parameter(Mandatory)] [string] $Description
                      )

                      $archives = @(
                          Get-ChildItem -LiteralPath 'dist' -Filter $Pattern -File
                      )
                      if ($archives.Count -ne 1) {
                          throw "Expected exactly one $Description matching $Pattern; found $($archives.Count)."
                      }
                      return $archives[0]
                  }

                  function Expand-CMakeArchive {
                      param(
                          [Parameter(Mandatory)] [System.IO.FileInfo] $Archive,
                          [Parameter(Mandatory)] [string] $Destination
                      )

                      New-Item -ItemType Directory -Path $Destination | Out-Null
                      Push-Location $Destination
                      try {
                          & cmake -E tar xf $Archive.FullName
                          if ($LASTEXITCODE -ne 0) {
                              throw "Could not extract $($Archive.FullName)."
                          }
                      } finally {
                          Pop-Location
                      }
                  }

                  $aio = Get-SingleArchive 'CSX_AIO-*.7z' 'AIO archive'
                  $se = Get-SingleArchive 'ShaderCache-SE-*.7z' 'SE shader-cache archive'
                  $vr = Get-SingleArchive 'ShaderCache-VR-*.7z' 'VR shader-cache archive'

                  $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
                  $workRoot = Join-Path $runnerTemp "csx-fomod-$([guid]::NewGuid())"
                  $workRoot = [System.IO.Path]::GetFullPath($workRoot)
                  $runnerPrefix = $runnerTemp.TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
                  if (-not $workRoot.StartsWith($runnerPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                      throw "FOMOD work directory escaped RUNNER_TEMP: $workRoot"
                  }

                  $candidate = "$($aio.FullName).fomod-tmp"
                  $backup = "$($aio.FullName).plain-backup"
                  if ((Test-Path -LiteralPath $candidate) -or (Test-Path -LiteralPath $backup)) {
                      throw 'Unexpected FOMOD candidate or backup already exists.'
                  }

                  try {
                      New-Item -ItemType Directory -Path $workRoot | Out-Null
                      $coreRoot = Join-Path $workRoot 'core'
                      $seRoot = Join-Path $workRoot 'se'
                      $vrRoot = Join-Path $workRoot 'vr'
                      $stagedRoot = Join-Path $workRoot 'staged'
                      Expand-CMakeArchive $aio $coreRoot
                      Expand-CMakeArchive $se $seRoot
                      Expand-CMakeArchive $vr $vrRoot

                      & python tools/build-fomod-package.py `
                          --core $coreRoot `
                          --se-cache $seRoot `
                          --vr-cache $vrRoot `
                          --output $stagedRoot `
                          --version $env:RELEASE_TAG
                      if ($LASTEXITCODE -ne 0) {
                          throw 'FOMOD staging failed.'
                      }

                      Push-Location $stagedRoot
                      try {
                          & cmake -E tar cf $candidate --format=7zip -- .
                          if ($LASTEXITCODE -ne 0) {
                              throw 'FOMOD archive creation failed.'
                          }
                      } finally {
                          Pop-Location
                      }

                      if (-not (Test-Path -LiteralPath $candidate) -or
                          (Get-Item -LiteralPath $candidate).Length -eq 0) {
                          throw 'FOMOD archive is missing or empty.'
                      }

                      $entries = @(& cmake -E tar tf $candidate) |
                          ForEach-Object {
                              $entry = $_.Trim().Replace('\', '/')
                              if ($entry.StartsWith('./')) {
                                  $entry = $entry.Substring(2)
                              }
                              $entry
                          }
                      if ($LASTEXITCODE -ne 0) {
                          throw 'FOMOD archive could not be inspected.'
                      }
                      foreach ($required in @(
                          'fomod/ModuleConfig.xml',
                          'fomod/info.xml',
                          'ShaderCache-VR/ShaderCache/Info.ini',
                          'ShaderCache-VR/ShaderCache/PackManifest.json',
                          'ShaderCache-VR/ShaderCache/Optimized.A.csxpack',
                          'ShaderCache-VR/ShaderCache/Optimized.B.csxpack',
                          'ShaderCache-VR/ShaderCache/Developer.A.csxpack',
                          'ShaderCache-VR/ShaderCache/Developer.B.csxpack',
                          'ShaderCache-SE-AE/ShaderCache/Info.ini',
                          'ShaderCache-SE-AE/ShaderCache/PackManifest.json',
                          'ShaderCache-SE-AE/ShaderCache/Optimized.A.csxpack',
                          'ShaderCache-SE-AE/ShaderCache/Optimized.B.csxpack',
                          'ShaderCache-SE-AE/ShaderCache/Developer.A.csxpack',
                          'ShaderCache-SE-AE/ShaderCache/Developer.B.csxpack'
                      )) {
                          if ($required -notin $entries) {
                              throw "FOMOD archive is missing $required."
                          }
                      }

                      try {
                          [System.IO.File]::Replace(
                              $candidate,
                              $aio.FullName,
                              $backup
                          )
                      } catch {
                          if (-not (Test-Path -LiteralPath $aio.FullName) -and
                              (Test-Path -LiteralPath $backup)) {
                              Move-Item -LiteralPath $backup -Destination $aio.FullName
                          }
                          throw
                      }
                      Remove-Item -LiteralPath $backup -Force
                      Write-Host "Replaced $($aio.Name) with the managed-cache FOMOD AIO."
                  } finally {
                      if (Test-Path -LiteralPath $candidate) {
                          Remove-Item -LiteralPath $candidate -Force
                      }
                      if (Test-Path -LiteralPath $workRoot) {
                          Remove-Item -LiteralPath $workRoot -Recurse -Force
                      }
                  }

            - name: Generate artifact attestations
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: "dist/*.7z"

            - name: Create or Update Release
              id: create_release
              uses: ncipollo/release-action@v1
              with:
                  name: "CSX ${{ steps.combined_notes.outputs.release_tag }}"
                  draft: true
                  omitDraftDuringUpdate: true
                  tag: ${{ steps.combined_notes.outputs.release_tag }}
                  artifacts: "${{ github.workspace }}/dist/*.7z"
                  bodyFile: ${{ steps.combined_notes.outputs.body_file }}
                  generateReleaseNotes: false
                  replacesArtifacts: true
                  removeArtifacts: true
                  allowUpdates: true

    nexus-dry-run:
        # Runs only on publish, independently of the build jobs (which are
        # skipped on publish). Artifacts were already built and attached to the
        # release when its draft was created, and nexus-upload downloads them
        # from the release assets — so there is nothing to wait on and no rebuild.
        # Stable tags only (no '-' in the tag name).
        name: Nexus Upload (dry run)
        if: >
            github.event_name == 'release' &&
            github.event.action == 'published' &&
            !contains(github.event.release.tag_name, '-')
        uses: ./.github/workflows/nexus-upload.yaml
        with:
            tag: ${{ github.event.release.tag_name }}
            artifact_pattern: "CSX-*.7z"
            dry_run: "true"
        secrets:
            UNEX_NEXUSMODS_SESSION_COOKIE: ${{ secrets.UNEX_NEXUSMODS_SESSION_COOKIE }}
            UNEX_APIKEY: ${{ secrets.UNEX_APIKEY }}
