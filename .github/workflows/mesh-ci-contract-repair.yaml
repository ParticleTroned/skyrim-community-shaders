name: Mesh CI contract repair (temporary)

on:
  push:
    branches: [codex/mesh-ci-contract-repair-20261031]
    paths: [.github/workflows/mesh-ci-contract-repair.yaml]

permissions:
  contents: read

jobs:
  restack:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bc076e6d95b644cf9ea07839ad9a01637d4269b5
          fetch-depth: 0
      - name: Summarize original snow native build errors
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import os, re, urllib.request
          url = 'https://api.github.com/repos/ParticleTroned/skyrim-community-shaders/actions/jobs/124623948008/logs'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              text = response.read().decode('utf-8-sig')
          errors = sorted({line.split('Z ', 1)[-1] for line in text.splitlines() if re.search(r'error (?:C\d+|LNK\d+|MSB\d+)', line)})
          for error in errors:
              print(error)
          if not errors:
              raise RuntimeError('No compiler errors found in the original failed native build log')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve stacked ancestry and verify exact trees
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nif = '49e7a8e99455199f3b72c09585e80d1e393a88ee'
          $snow = 'bc076e6d95b644cf9ea07839ad9a01637d4269b5'
          $land = '59768c9c9e054a7a63b8b6a43f396eca747d4700'
          $metadata = @('docs/development/unified-preset-policy.json', 'docs/development/generated-unified-preset-report.json')
          foreach ($tier in @('Performance', 'Balanced', 'Quality')) {
              $metadata += "MGO-Presets/CSX Unified- $tier - Press END on PC to Customize/SKSE/Plugins/CommunityShaders/SettingsUser.json"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          foreach ($sha in @($nif, $snow, $land)) {
              git cat-file -e "${sha}^{commit}"
              if ($LASTEXITCODE -ne 0) { throw "Missing reviewed staging commit $sha" }
          }
          foreach ($output in @('codex/mesh-ci-stack-snow-20261031', 'codex/mesh-ci-stack-land-20261031')) {
              $existing = git ls-remote --heads origin "refs/heads/$output"
              if ($LASTEXITCODE -ne 0 -or $existing) { throw "Output exists or cannot be checked: $output" }
          }
          function Merge-ReviewedParent([string]$parent) {
              git merge --no-ff --no-commit $parent
              $mergeExit = $LASTEXITCODE
              if ($mergeExit -notin @(0, 1)) { throw 'Merge command failed.' }
              $conflicts = @(git diff --name-only --diff-filter=U)
              if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect merge conflicts.' }
              foreach ($path in $conflicts) {
                  if ($path -notin $metadata) { throw "Unexpected source conflict: $path" }
                  git checkout --ours -- $path
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot retain child-specific metadata.' }
                  git add -- $path
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot stage child-specific metadata.' }
              }
              if ($mergeExit -eq 1 -and $conflicts.Count -eq 0) { throw 'Merge failed without expected metadata conflicts.' }
              git diff --cached --check
              if ($LASTEXITCODE -ne 0) { throw 'Invalid staged diff.' }
          }

          Merge-ReviewedParent $nif
          git diff --cached --exit-code $snow --
          if ($LASTEXITCODE -ne 0) { throw 'Snow merge changed the already-tested source tree.' }
          & ./tools/generate-unified-presets.ps1 -Check
          git commit -m 'merge: carry NIF CI fixes into projected snow stack'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit snow ancestry update.' }
          $snowFinal = (git rev-parse HEAD).Trim()
          git push origin 'HEAD:refs/heads/codex/mesh-ci-stack-snow-20261031'
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage snow ancestry update.' }

          git checkout --detach $land
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out LAND staging commit.' }
          Merge-ReviewedParent $snowFinal
          $changes = @(git diff --cached --name-only $land --)
          $harness = 'tests/shaders/runtime_discovered_tests.cpp'
          if ($changes.Count -ne 1 -or $changes[0] -cne $harness) { throw "Unexpected LAND merge diff: $($changes -join ', ')" }
          git diff --cached --exit-code $snowFinal -- $harness
          if ($LASTEXITCODE -ne 0) { throw 'LAND must inherit the exact reviewed shader failure reporting fix.' }
          & ./tools/generate-unified-presets.ps1 -Check
          git diff --cached
          git commit -m 'merge: carry snow CI fixes and shader diagnostics into LAND stack'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit LAND ancestry update.' }
          $landFinal = (git rev-parse HEAD).Trim()
          git push origin 'HEAD:refs/heads/codex/mesh-ci-stack-land-20261031'
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage LAND ancestry update.' }
          "NIF=$nif`nSNOW=$snowFinal`nLAND=$landFinal" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
