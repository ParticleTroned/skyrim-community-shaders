# Internal experiment. Copy to Data/SKSE/Plugins/CommunityShaders/NRColor.ini
# then use the existing NR Runtime Reset action (or restart).
# Native is deliberately UNKNOWN transfer, not an assertion of linear light.
# These profiles preserve broad source appearance using a code-value metric.
# SourceTransfer=srgb is appropriate only after confirming sRGB-encoded values.
# Non-identity codecs require an explicitly confirmed linear source; those
# codec experiments are not enabled by this example.

[UpscaledCentre]
Mode=preserve_lighting
SourceTransfer=native
ModelCodec=identity
DetailStrength=0.65
AppearanceMix=0
MaxDetailStops=1
Radius=2
RoundTrip=0

[FinalLdrPreUI]
Mode=preserve_lighting
SourceTransfer=native
ModelCodec=identity
DetailStrength=0.65
AppearanceMix=0
MaxDetailStops=1
Radius=2
RoundTrip=0
