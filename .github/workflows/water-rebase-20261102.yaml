name: Water dev rebase 20261102

on:
  push:
    branches: [build/os-water-rebase-20261102]
    paths:
      - .github/workflows/water-rebase-20261102.yaml
      - .water-port/prepare_rebase_20261102.py
      - .water-port/water-rebase-approval.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: water-prepare-branches
  cancel-in-progress: false

jobs:
  rebase:
    if: github.repository == 'ParticleTroned/skyrim-community-shaders' && github.ref == 'refs/heads/build/os-water-rebase-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ParticleTroned/skyrim-community-shaders
          ref: 362160e22b2b7589590ed9489e34bd31100639cd
          path: source
          fetch-depth: 100
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install git+https://github.com/alandtse/hlslkit.git@d0ed83ab12fc48b9ee03ddf61b21e80bfa5c3778 "setuptools>=60,<80" pyfomod PyYAML
      - name: Replay and verify every water branch; publish only approved output
        run: python control/.water-port/prepare_rebase_20261102.py
      - name: Upload source audit and rebase report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: water-dev-rebase-20261102
          path: water-rebase-output/
          retention-days: 30
          if-no-files-found: warn
